async function gConn(){const id=(S.cfg.gcid||'').trim();if(!id){gS('Informe e salve o Client ID primeiro.');return}if(location.protocol=='file:'){gS('O Google não aceita login com o arquivo aberto direto (file://). Hospede a página ou use um servidor local, ou use a alternativa de arquivo vinculado.');return}
try{await gLoad();google.accounts.oauth2.initTokenClient({client_id:id,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.error){gS('Erro de autorização: '+r.error);return}GT=r.access_token;gS('Conectado ao Google Drive.')}}).requestAccessToken()}catch(x){gS(x.message)}}
async function gApi(u,o={}){if(!GT)throw new Error('Conecte ao Google primeiro.');const r=await fetch(u,{...o,headers:{Authorization:'Bearer '+GT,...(o.headers||{})}});if(r.status==401){GT=null;throw new Error('Sessão expirada: conecte novamente.')}if(!r.ok)throw new Error('Erro do Drive ('+r.status+').');return r}
async function gFind(){const r=await gApi('https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,modifiedTime)&q='+encodeURIComponent("name='"+GF+"'"));return(await r.json()).files[0]}
async function gUp(){try{gS('Enviando…');const body=JSON.stringify(S),f=await gFind();if(f)await gApi('https://www.googleapis.com/upload/drive/v3/files/'+f.id+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body});else{const b='b'+Date.now();await gApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify({name:GF,parents:['appDataFolder']})}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`})}gS('Enviado ao Drive em '+new Date().toLocaleString())}catch(x){gS(x.message)}}
async function gDown(){try{const f=await gFind();if(!f){gS('Nenhum backup encontrado no Drive.');return}const r=await gApi('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');applyTxt(await r.text(),'Backup do Drive de '+new Date(f.modifiedTime).toLocaleString())}catch(x){gS(x.message)}}
function applyTxt(t,l){try{const o=JSON.parse(t);if(!o||o.v!==1||!Array.isArray(o.perf)||!Array.isArray(o.errs)||!Array.isArray(o.hist)||typeof o.done!='object'||typeof o.cfg!='object'||!Array.isArray(o.cfg.revInt))throw 0;if(!confirm((l||'Arquivo')+': isso substitui TODOS os dados atuais deste navegador. Continuar?'))return;const k=S.cfg.gcid;S=Object.assign(dflt(),o);S.cfg.gcid=k;sv();ap();render();toast('Dados restaurados.')}catch(x){gS('Arquivo inválido: nada foi alterado.')}}
async function fWrite(){if(!FH)return;const w=await FH.createWritable();await w.write(JSON.stringify(S,null,1));await w.close()}
async function fLink(){try{FH=await showSaveFilePicker({suggestedName:GF,types:[JT]});await fWrite();gS('Arquivo vinculado: '+FH.name+'. Salvando automaticamente a cada alteração.')}catch(x){FH=null;if(x.name!='AbortError')gS('Recurso não suportado ou bloqueado neste navegador.')}}
async function fOpen(){try{const[h]=await showOpenFilePicker({types:[JT]});applyTxt(await(await h.getFile()).text(),h.name)}catch(x){if(x.name!='AbortError')gS('Recurso não suportado ou bloqueado neste navegador.')}}
function gSched(){clearTimeout(gTm);if(!FH&&!(GT&&S.cfg.gauto))return;gTm=setTimeout(()=>{if(FH)fWrite().catch(x=>gS('Falha ao gravar o arquivo: '+x.message));if(GT&&S.cfg.gauto)gUp()},4000)}
function gSave(){S.cfg.gcid=$('#gid').value.trim();S.cfg.gauto=$('#gau').checked;sv();toast('Salvo.')}
V.dados=m=>{const c=S.cfg;m.innerHTML=`<h2>Dados e Configurações</h2><div class="c"><div class="f"><label>Minutos por sessão<input id="c1" type="number" min="1" value="${c.sessMin}"></label><label>Descanso (min)<input id="c2" type="number" min="1" value="${c.breakMin}"></label><label>Revisões (dias, vírgula)<input id="c3" value="${c.revInt.join(',')}"></label><label>Faixa reforço (&lt;%)<input id="c4" type="number" value="${c.lo}"></label><label>Faixa bom (≥%)<input id="c5" type="number" value="${c.hi}"></label></div>
<h3 style="margin-top:1rem">Sessões por disciplina no ciclo</h3><div class="f">${D.map((d,i)=>`<label>${e(d.n)}<input class="cs" type="number" min="0" max="9" value="${sc(i)}"></label>`).join('')}</div><p><button class="pb" onclick="saveC()">Salvar configurações</button></p></div>
<div class="c" style="margin-top:.8rem"><h3>Sincronizar com o Google Drive</h3><p class="mu">Os dados continuam salvos no navegador; a sincronização é uma cópia no seu Drive. A cópia fica na pasta oculta do aplicativo (não aparece em "Meu Drive"). Ao baixar do Drive, os dados atuais deste navegador são substituídos (último a gravar vence).</p>
<details><summary>Como obter o Client ID (uma vez só)</summary><ol class="mu"><li>Em console.cloud.google.com, crie um projeto.</li><li>Ative a "Google Drive API".</li><li>Em "Tela de consentimento OAuth", configure como Externo e adicione seu e-mail como usuário de teste.</li><li>Em "Credenciais", crie um "ID do cliente OAuth" do tipo Aplicativo da Web.</li><li>Em "Origens JavaScript autorizadas", informe o endereço onde esta página está hospedada (ex.: https://seuusuario.github.io ou http://localhost:8000). O Google <b>não aceita</b> login com o arquivo aberto direto do computador (file://).</li><li>Cole o Client ID abaixo e salve.</li></ol></details>
<div class="f"><input id="gid" placeholder="Client ID (….apps.googleusercontent.com)" value="${e(c.gcid||'')}" aria-label="Client ID"><label><input type="checkbox" id="gau" ${c.gauto?'checked':''} style="width:auto"> Enviar automaticamente após alterações (enquanto conectado)</label></div>
<p><button onclick="gSave()">Salvar</button> <button class="pb" onclick="gConn()">Conectar ao Google</button> <button onclick="gUp()">Enviar para o Drive</button> <button onclick="gDown()">Baixar do Drive</button></p><p class="mu">A conexão dura cerca de 1 hora; depois é preciso conectar de novo. Requer internet.</p>
<h3>Alternativa sem configuração (Chrome ou Edge)</h3><p class="mu">Com o Google Drive para computador instalado, vincule um arquivo dentro da pasta do Drive: a plataforma grava nele a cada alteração e o Drive sincroniza. O vínculo vale só até fechar a aba.</p><button onclick="fLink()">Vincular arquivo</button> <button onclick="fOpen()">Restaurar de arquivo</button><p id="gst" class="mu" role="status"></p></div>
<div class="c" style="margin-top:.8rem"><h3>Backup</h3><p class="mu">⚠ Os dados ficam salvos apenas neste navegador e dispositivo (localStorage). Não é uma conta na nuvem e pode ser perdido se você limpar os dados do navegador. Exporte backups com frequência.</p><button class="pb" onclick="exp()">Exportar JSON</button> <input type="file" id="imp" accept=".json" style="width:auto" onchange="imp(this.files[0])"> <button class="dg" onclick="if(confirm('Apagar TODOS os dados?')){S=dflt();sv();ap();render()}">Apagar tudo</button></div>`};
function saveC(){const I=$('#c3').value.split(',').map(x=>parseFloat(x)).filter(x=>x>0),n=k=>parseFloat($('#'+k).value);if(!I.length||!(n('c1')>0)||!(n('c2')>0)||!(n('c4')<=n('c5'))){toast('Valores inválidos.');return}
Object.assign(S.cfg,{sessMin:n('c1'),breakMin:n('c2'),revInt:I,lo:n('c4'),hi:n('c5')});document.querySelectorAll('.cs').forEach((x,i)=>S.cfg.sess[i]=Math.max(0,parseInt(x.value)||0));sv();toast('Configurações salvas.')}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='backup-ciclo-prf.json';a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1||!Array.isArray(o.perf)||!Array.isArray(o.errs)||!Array.isArray(o.hist)||typeof o.done!='object'||typeof o.cfg!='object'||!Array.isArray(o.cfg.revInt))throw 0;if(!confirm('Importar substitui TODOS os dados atuais. Continuar?'))return;S=Object.assign(dflt(),o);sv();ap();render();toast('Importado com sucesso.')}catch(x){toast('Arquivo inválido: nada foi alterado.')}};r.readAsText(f)}
function srch(v){const b=$('#sr'),q=v.trim().toLowerCase();if(q.length<2){b.style.display='none';return}const r=[];D.forEach((d,i)=>{if(d.n.toLowerCase().includes(q))r.push(['edital',d.n,v,i])});items.forEach(it=>{if(r.length<10&&it.t.toLowerCase().includes(q))r.push(['edital',D[it.di].n+' – '+it.n+' '+it.t.slice(0,70),v,it.di])});S.errs.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))r.push(['erros','Erro: '+(x.ass||x.enun.slice(0,50)),v])});
b.style.display='block';b.innerHTML=r.slice(0,12).map((x,i)=>`<div data-i="${i}">${e(x[1])}</div>`).join('')||'<div>Nada encontrado</div>';b.onclick=ev=>{const d=ev.target.closest('[data-i]');if(!d)return;const x=r[d.dataset.i];if(x[0]=='edital'){edQ=x[2];if(x[3]!=null)openD.add(x[3])}else errQ=x[2];b.style.display='none';go(x[0])}}
ap();render();
</script></body></html>
